<script>
/* Elke keer een andere achtergrond: willekeurig palet (kleuren die bij elkaar passen, donker genoeg voor witte tekst)
   met willekeurige mengplekken. Niet twee keer achter elkaar hetzelfde palet. Staat hier zodat er geen flits is. */
(function () {
  var P = [ // [basis, kleur1..4]
    ['#08183f', '#1b4f9c', '#1a9fb5', '#5b6cff', '#0e2f6b'],   // oceaan
    ['#04221f', '#0e6b55', '#22a58a', '#1b5a7a', '#0a3d3a'],   // noorderzee
    ['#170b3d', '#5a2399', '#8a3fc0', '#2e2a8c', '#3b1670'],   // paarse nacht
    ['#24184f', '#a95a8e', '#d4808e', '#5a5fae', '#55307a'],   // zonsondergang
    ['#081c13', '#1f5c3a', '#3f8a46', '#0f3d3a', '#2a6a5a'],   // bos
    ['#2c0c26', '#b0485e', '#d9765c', '#5a2a6e', '#7a2a4a'],   // koraal
    ['#0a1d38', '#2a6f9e', '#5fa8cc', '#3b4f9c', '#1a3f6a'],   // ijs
    ['#1a1230', '#b0703a', '#d8a050', '#4a2a7a', '#8a3a5a'],   // goud en paars
    ['#1c1442', '#6b5bb5', '#9f74cc', '#3f6fb0', '#4a3a8a'],   // lavendel
    ['#0b2230', '#1f6f7a', '#a8507a', '#3a2a6a', '#185a6a'],   // petrol en roze
    ['#220b30', '#7a1f5c', '#a8367a', '#3a2a8a', '#5a1a6a'],   // druif
    ['#04202e', '#0f6a6a', '#27a888', '#1a4a8a', '#0d4a5a'],   // smaragd en blauw
    ['#2a1430', '#a85a78', '#d08a72', '#6a3a7a', '#7a3a5a'],   // perzik
    ['#0d1a2a', '#2f5a7a', '#6a8aa8', '#3a3f6a', '#1f3f55']    // leisteen
  ];
  var last = -1, i;
  try { last = +localStorage.getItem('dash-pal'); } catch (e) {}
  do { i = Math.floor(Math.random() * P.length); } while (P.length > 1 && i === last);
  try { localStorage.setItem('dash-pal', i); } catch (e) {}
  var p = P[i], r = function (a, b) { return Math.round(a + Math.random() * (b - a)); };
  var blob = function (c, a) { return 'radial-gradient(' + r(32, 58) + '% ' + r(30, 55) + '% at ' + r(-5, 105) + '% ' + r(-5, 105) + '%,' + c + (a || '') + ',transparent 70%)'; };
  var w = document.querySelector('.wall');
  w.style.setProperty('--mesh', [blob(p[2]), blob(p[3]), blob(p[1]), blob(p[4]), blob(p[2], 'bb'), blob(p[3], 'aa')].join(',') + ',linear-gradient(' + r(150, 210) + 'deg,' + p[0] + ',' + p[4] + ')');
  w.style.setProperty('--glow', [blob(p[2], '66'), blob(p[3], '60'), blob(p[1], '55'), blob(p[4], '55')].join(','));
  document.documentElement.style.background = document.body.style.background = p[0];
})();
</script>
